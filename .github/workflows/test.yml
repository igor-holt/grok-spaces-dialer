name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python client dependencies
        run: python -m pip install "requests>=2.31.0" "python-dotenv>=1.0.0"
      - name: Worker tests
        run: node --test --test-concurrency=1 workers/grok-spaces-dialer.test.js
      - name: Python client tests
        run: python -m unittest discover -s tests -v
